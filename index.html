<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="description" content="Wordle, crucigrama, sudoku y lexireto en español">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pasatiempos">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="barra">
    <button class="barra-btn" id="btn-atras" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="titulo">Pasatiempos</h1>
    <button class="barra-btn" id="btn-ayuda" aria-label="Cómo se juega" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="vista"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true">
      <button class="modal-cerrar" aria-label="Cerrar">&times;</button>
      <div class="modal-contenido"></div>
    </div>
  </div>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="js/comun.js"></script>
  <script src="js/teclado.js"></script>
  <script src="js/wordle.js"></script>
  <script src="js/sudoku.js"></script>
  <script src="js/lexireto.js"></script>
  <script src="js/crucigrama.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
